<style>

  .scroll-slim::-webkit-scrollbar-track{background:transparent}
  .no-spin::-webkit-outer-spin-button,.no-spin::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
  .no-spin{-moz-appearance:textfield}

  @keyframes fadeUp{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
  @keyframes fadeIn{from{opacity:0}to{opacity:1}}
  @keyframes popIn{0%{opacity:0;transform:scale(.8)}70%{transform:scale(1.05)}100%{opacity:1;transform:scale(1)}}
  @keyframes toastIn{from{opacity:0;transform:translateY(14px) scale(.97)}to{opacity:1;transform:translateY(0) scale(1)}}
  @keyframes modalIn{from{opacity:0;transform:translateY(14px) scale(.96)}to{opacity:1;transform:translateY(0) scale(1)}}
  @keyframes scanY{0%,100%{top:12%}50%{top:86%}}
  @keyframes livePulse{0%{box-shadow:0 0 0 0 rgba(16,185,129,.5)}70%{box-shadow:0 0 0 7px rgba(16,185,129,0)}100%{box-shadow:0 0 0 0 rgba(16,185,129,0)}}
  @keyframes redPulse{0%{box-shadow:0 0 0 0 rgba(239,68,68,.45)}70%{box-shadow:0 0 0 7px rgba(239,68,68,0)}100%{box-shadow:0 0 0 0 rgba(239,68,68,0)}}
  @keyframes shimmerMove{100%{transform:translateX(100%)}}
  @keyframes barShrink{from{width:100%}to{width:0%}}
  @keyframes dropin{0%{transform:translateY(-16px) scale(.5);opacity:0}60%{transform:translateY(3px) scale(1.12);opacity:1}100%{transform:translateY(0) scale(1);opacity:1}}
  @keyframes newRing{0%{box-shadow:0 0 0 0 rgba(30,64,175,.3)}100%{box-shadow:0 0 0 12px rgba(30,64,175,0)}}
  @keyframes bigCheck{0%{transform:scale(.3);opacity:0}60%{transform:scale(1.15);opacity:1}100%{transform:scale(1);opacity:1}}
  @keyframes drawCheck{to{stroke-dashoffset:0}}

  .anim-fadeUp{animation:fadeUp .5s cubic-bezier(.21,.9,.35,1) both}
  .anim-fadeIn{animation:fadeIn .25s ease both}
  .anim-popIn{animation:popIn .4s cubic-bezier(.21,.9,.35,1) both}
  .anim-toastIn{animation:toastIn .35s cubic-bezier(.21,.9,.35,1) both}
  .anim-modalIn{animation:modalIn .32s cubic-bezier(.21,.9,.35,1) both}
  .anim-scanY{animation:scanY 1.5s ease-in-out infinite}
  .anim-live{animation:livePulse 2s ease-out infinite}
  .anim-red{animation:redPulse 1.8s ease-out infinite}
  .anim-newRing{animation:newRing 1.8s ease-out infinite}
  .anim-bigCheck{animation:bigCheck .55s cubic-bezier(.21,.9,.35,1) both}
  .shimmer{position:relative;overflow:hidden}
  .shimmer::after{content:'';position:absolute;inset:0;transform:translateX(-100%);background:linear-gradient(90deg,transparent,rgba(248,250,252,.85),transparent);animation:shimmerMove 1.4s infinite}
  .scanline{position:absolute;left:10px;right:10px;height:2px;background:#10b981;box-shadow:0 0 12px 2px rgba(16,185,129,.55);border-radius:2px;z-index:5}

  /* Leaflet theming */
  .leaflet-container{font-family:'Instrument Sans',sans-serif;background:#e8eef4}
  .leaflet-popup-content-wrapper{border-radius:14px;box-shadow:0 12px 32px -8px rgba(15,23,42,.28)}
  .leaflet-popup-content{margin:12px 14px;line-height:1.35}
  .leaflet-bar{border:none!important;box-shadow:0 4px 12px -2px rgba(15,23,42,.18)!important;overflow:hidden;border-radius:10px!important}
  .leaflet-bar a{border:none!important;color:#334155!important}
  .leaflet-control-attribution{font-size:9px;background:rgba(255,255,255,.75)!important}
  .rx-pin{background:transparent;border:none}

/* ============================================================
   HELPERS & VALIDATION
   ============================================================ */
const hash = s => { let h=7; for(let i=0;i<s.length;i++){ h=(h*31+s.charCodeAt(i))>>>0; } return h; };
const digitsOf = v => v.replace(/[\s-]/g,'');

const RX_PHONE = /^(?:\+94|0)7\d{8}$/;
const RX_EMAIL = /^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/;
const RX_NMRA  = /^NMRA\/PH\/\d{4}\/\d{4}$/;
const RX_SLMC  = /^SLMC\/\d{5}$/;

function statusOf(phId, medName, branchStock){
  const k = medName.toLowerCase();
  if (phId==='hg1' && branchStock && branchStock[k]) return branchStock[k];
  const ov = STOCK_OVERRIDES[phId];
  if (ov && ov[k]) return ov[k];
  return hash(phId+'::'+k)%10 < 6 ? 'in' : (hash(phId+'::'+k)%10 < 8 ? 'low' : 'out');
}

function buildResults(query, districtName, branchStock){
  const q = query.toLowerCase();
  const medEntry = MEDICINES.find(m => q.includes(m.name.toLowerCase()) || m.name.toLowerCase().includes(q));
  const display = medEntry ? `${medEntry.name} ${medEntry.strength}` : query;
  const altName = medEntry ? medEntry.alts[0] : null;

  const list = PHARMACIES
    .filter(p => p.district === districtName)
    .map(p => ({...p, status: statusOf(p.id, display, branchStock), med: display}))
    .sort((a,b) => a.dist - b.dist);

  if (altName){
    list.filter(r => r.status==='out').forEach(r => {
      const cands = PHARMACIES
        .filter(p => p.id!==r.id && p.district===districtName)
        .map(p => ({...p, status: statusOf(p.id, altName, branchStock)}))
        .sort((a,b) => a.dist - b.dist);
      const good = cands.find(c=>c.status==='in') || cands.find(c=>c.status==='low');
      r.altName = altName;
      r.alt = good ? {name: good.name, dist: good.dist} : null;
    });
  }
  return {display, list};
}

function validateAuth(form, role, mode){
  const e = {};
  const pw = form.password;
  if (role === 'patient'){
    if (mode==='signup' && form.name.trim().length < 3) e.name = "Enter the patient's full name (min 3 characters).";
    if (!RX_EMAIL.test(form.identifier.trim()) && !RX_PHONE.test(digitsOf(form.identifier)))
      e.identifier = 'Enter a valid email or Sri Lankan mobile (e.g. +94 77 862 4415).';
    if (pw.length < 8) e.password = 'Password must be at least 8 characters.';
    if (mode==='signup' && pw !== form.confirm) e.confirm = 'Passwords do not match.';
  } else {
    if (mode === 'signup'){
      if (form.phName.trim().length < 3) e.phName = 'Enter the registered pharmacy name.';
      if (!form.district) e.district = 'Select the registration district.';
      if (form.city.trim().length < 2) e.city = 'Enter the city or area (e.g. Bambalapitiya).';
      if (!RX_NMRA.test(form.nmra.trim().toUpperCase())) e.nmra = 'Invalid format — use NMRA/PH/YYYY/NNNN (e.g. NMRA/PH/2026/0147).';
      if (!RX_SLMC.test(form.slmc.trim().toUpperCase())) e.slmc = 'Invalid format — use SLMC/NNNNN (e.g. SLMC/19842).';
      if (pw.length < 8) e.password = 'Password must be at least 8 characters.';
      if (pw !== form.confirm) e.confirm = 'Passwords do not match.';
    } else {
      if (!RX_NMRA.test(form.identifier.trim().toUpperCase())) e.identifier = 'Enter your NMRA licence number (NMRA/PH/YYYY/NNNN).';
      if (!pw) e.password = 'Enter your password.';
    }
  }
  return e;
}

const nameFromIdentifier = v => {
  if (/@/.test(v)){
    const local = v.split('@')[0].replace(/[._-]+/g,' ').trim();
    return local ? local.split(' ').map(w=>w.charAt(0).toUpperCase()+w.slice(1)).join(' ') : 'Patient';
  }
  return 'Valued Patient';
};

function useClickOutside(ref, handler){
  useEffect(() => {
    const h = e => { if (ref.current && !ref.current.contains(e.target)) handler(); };
    document.addEventListener('mousedown', h);
    return () => document.removeEventListener('mousedown', h);
  }, []);
}

   ============================================================ */
function PinPicker({initial, onChange, pushToast}){
  const elRef = useRef(null);
  const mapRef = useRef(null);
  const mkRef = useRef(null);
  const [pos, setPos] = useState(initial);

  useEffect(() => {
    const map = L.map(elRef.current, {zoomControl:false, attributionControl:false, scrollWheelZoom:false})
      .setView([initial.lat, initial.lng], 14);
    L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png', {maxZoom:19}).addTo(map);
    const mk = L.marker([initial.lat, initial.lng], {
      draggable:true,
      icon: L.divIcon({className:'rx-pin', html:'<span style="--c:#1e40af"></span>', iconSize:[22,22], iconAnchor:[11,11]})
    }).addTo(map);
    const commit = p => {
      const v = {lat:+p.lat.toFixed(5), lng:+p.lng.toFixed(5)};
      setPos(v); onChange(v);
    };
    mk.on('dragend', () => commit(mk.getLatLng()));
    map.on('click', e => { mk.setLatLng(e.latlng); commit(e.latlng); });
    mapRef.current = map; mkRef.current = mk;
    const t1 = setTimeout(()=>map.invalidateSize(), 60);
    const t2 = setTimeout(()=>map.invalidateSize(), 350);
    return () => { clearTimeout(t1); clearTimeout(t2); map.remove(); };
  }, []);

  const locate = () => {
    if (!navigator.geolocation){ pushToast('Geolocation unavailable — drag the pin instead.', 'info'); return; }
    pushToast('Requesting your current location…', 'info');
    navigator.geolocation.getCurrentPosition(
      p => {
        const v = {lat:+p.coords.latitude.toFixed(5), lng:+p.coords.longitude.toFixed(5)};
        mapRef.current.setView([v.lat, v.lng], 15);
        mkRef.current.setLatLng([v.lat, v.lng]);
        setPos(v); onChange(v);
        pushToast('Storefront pin set to your current location.', 'success');
      },
      () => pushToast('Location permission denied — drag the pin to your storefront.', 'error'),
      {timeout: 6000}
    );
  };

  return (
    <React.Fragment>
      <div ref={elRef} className="w-full h-full"/>
      <div className="absolute top-2 left-2 z-[500] pointer-events-none rounded-lg border border-slate-200 bg-white/90 backdrop-blur px-2.5 py-1 text-[10px] font-mono font-semibold text-slate-600 shadow-sm">
        {pos.lat.toFixed(5)}, {pos.lng.toFixed(5)}
      </div>
      <button type="button" onClick={locate}
        className="absolute bottom-2 right-2 z-[500] inline-flex items-center gap-1.5 rounded-lg border border-slate-200 bg-white/95 px-2.5 py-1.5 text-[11px] font-semibold text-slate-600 hover:text-rx-blue hover:border-rx-blue/40 shadow-sm transition">
        <Icon name="locate" size={12}/>Use my location
      </button>
    </React.Fragment>
  );
}

    if (firstRef.current) firstRef.current.focus();
    const h = e => { if (e.key==='Escape') onClose(); };
    window.addEventListener('keydown', h);
    document.body.style.overflow = 'hidden';
    return () => { window.removeEventListener('keydown', h); document.body.style.overflow = ''; };
  }, []);

  const errors = useMemo(() => validateAuth(form, role, mode), [form, role, mode]);
  const errFor = k => touched[k] ? errors[k] : null;
  const touch = k => () => setTouched(t => ({...t, [k]:true}));
  const set = k => e => setForm(f => ({...f, [k]: e.target.value}));

  const STEPS = role==='pharmacy' ? [
    {icon:'check',   t:'Validating application credentials'},
    {icon:'shield',  t:'Cross-checking NMRA retail licence registry'},
    {icon:'idCard',  t:'Verifying SLMC pharmacist registration'},
    {icon:'mapPin',  t:'Registering store geofence coordinates'},
  ] : [
    {icon:'check',   t:'Creating your secure account'},
    {icon:'mail',    t:'Verifying contact details'},
    {icon:'radio',   t:'Syncing with the islandwide shortage engine'},
  ];

  useEffect(() => {
    if (phase!=='verifying') return;
    if (vStep < STEPS.length){
      const t = setTimeout(()=>setVStep(s=>s+1), role==='pharmacy' ? 640 : 430);
      return () => clearTimeout(t);
    }
    const t = setTimeout(()=>setPhase('done'), 700);
    return () => clearTimeout(t);
  }, [phase, vStep, role]);

  const switchRole = r => {
    if (phase!=='form') return;
    setRole(r);
    setTouched({});
    setForm(f => ({...f, identifier:''}));
  };
  const switchMode = m => { if (phase!=='form') return; setMode(m); setTouched({}); };

  const onSubmit = e => {
    e.preventDefault();
    if (phase!=='form' || busy) return;
    const all = {};
    Object.keys(form).forEach(k => { all[k] = true; });
    setTouched(all);
    if (Object.keys(errors).length){
      pushToast('Please fix the highlighted fields before continuing.', 'error');
      return;
    }
    setBusy(true);
    setTimeout(() => { setBusy(false); setVStep(0); setPhase('verifying'); }, 600);
  };

  const finishAuth = () => {
    if (role === 'patient'){
      const d = digitsOf(form.identifier);
      const isPhone = RX_PHONE.test(d);
      const name = (mode==='signup' && form.name.trim()) ? form.name.trim() : nameFromIdentifier(form.identifier);
      onAuth({role:'patient', name, contact: form.identifier, phone: isPhone ? d : ''});
    } else {
      const lic = (mode==='signup' ? form.nmra : form.identifier).trim().toUpperCase();
      const reg = PHARMACY_REGISTRY[lic];
      onAuth({
        role:'pharmacy',
        phName:   mode==='signup' ? form.phName.trim() : (reg ? reg.name : 'Partner Community Pharmacy'),
        district: mode==='signup' ? form.district     : (reg ? reg.district : 'Colombo'),
        city:     mode==='signup' ? form.city.trim()  : (reg ? reg.city : 'Colombo'),
        license:  lic,
        slmc:     mode==='signup' ? form.slmc.trim().toUpperCase() : 'SLMC/10432',
        coords,
        verified: mode!=='signup',
      });
    }
  };

  const inputCls = 'w-full rounded-xl border border-slate-200 bg-slate-50/60 pl-3.5 pr-3.5 py-2.5 text-sm font-semibold text-slate-700 outline-none focus:border-rx-blue focus:bg-white focus:ring-4 focus:ring-rx-blue/10 transition cursor-pointer';

  return (
    <div className="fixed inset-0 z-[80] flex items-end sm:items-center justify-center sm:p-4">
      <div className="absolute inset-0 bg-slate-900/45 backdrop-blur-[3px] anim-fadeIn" onClick={onClose}/>
      <div role="dialog" aria-modal="true" aria-label="Sign in or create account"
        className={`relative w-full ${role==='pharmacy' ? 'sm:max-w-lg' : 'sm:max-w-md'} bg-white rounded-t-3xl sm:rounded-2xl shadow-pop anim-modalIn max-h-[92vh] overflow-y-auto scroll-slim`}>

        {/* Modal header */}
        <div className="p-5 pb-4 border-b border-slate-100 sticky top-0 bg-white/95 backdrop-blur z-10">
          <div className="flex items-start justify-between gap-3">
            <div className="flex items-center gap-3">
              <LogoMark size={40}/>
              <div>
                <h3 className="font-display font-bold text-slate-900 leading-tight">
                  {role==='patient'
                    ? (mode==='signin' ? 'Welcome back' : 'Join RxBridge LK')
                    : (mode==='signin' ? 'Pharmacy Partner Sign In' : 'Pharmacy Partner Onboarding')}
                </h3>
                <p className="text-xs text-slate-400 mt-0.5">
                  {role==='patient' ? 'Search, scan & reserve medicines islandwide' : 'NMRA & SLMC verified onboarding in minutes'}
                </p>
              </div>
            </div>
            <button onClick={onClose} aria-label="Close dialog"
              className="grid place-items-center w-8 h-8 rounded-lg text-slate-400 hover:text-slate-700 hover:bg-slate-100 transition shrink-0"><Icon name="x" size={16}/></button>
          </div>

          {/* Role segmented control */}
          <div className="mt-4 relative grid grid-cols-2 rounded-xl border border-slate-200 bg-slate-100/80 p-1" role="tablist" aria-label="Account role">
            <span aria-hidden="true" className="absolute inset-y-1 left-1 rounded-lg bg-white shadow-sm ring-1 ring-slate-900/5 transition-transform duration-300 ease-out"

                <Icon name={t.icon} size={15}/>{t.label}

          </div>

          {/* Sign In / Create Account sub-toggle */}
          <div className="mt-2.5 flex justify-center">
            <div className="relative grid grid-cols-2 rounded-lg bg-slate-100 p-0.5 text-xs font-semibold" role="tablist" aria-label="Authentication mode">

            {role==='pharmacy' && mode==='signin' && (

                <Field label="NMRA Retail Licence No." htmlFor="au-lic" error={errFor('identifier')}>

                <div className="grid grid-cols-2 gap-3">
                  <Field label="District" htmlFor="au-dist" error={errFor('district')}>
                    <div className="relative">
                      <select id="au-dist" value={form.district} onChange={set('district')} onBlur={touch('district')}

                {/* Storefront pin */}
                <div>
                  <label className="block text-[11px] font-bold uppercase tracking-wider text-slate-400 mb-1.5">Storefront Location Pin</label>
                  <div className="relative h-44 rounded-xl overflow-hidden border border-slate-200 shadow-inner">

                </div>

            <button type="submit" disabled={busy}
              className="w-full inline-flex items-center justify-center gap-2 rounded-xl bg-rx-blue px-4 py-3 text-sm font-bold text-white shadow-[0_12px_24px_-10px_rgba(30,64,175,.6)] hover:bg-blue-800 active:scale-[.99] transition-all duration-150 disabled:opacity-60 mt-1">
              {busy
                ? <React.Fragment><Icon name="refresh" size={15} className="animate-spin"/>Validating…</React.Fragment>
                : <React.Fragment><Icon name={mode==='signin'?'lock':'shield'} size={15}/>{mode==='signin' ? 'Sign In Securely' : (role==='pharmacy' ? 'Submit for NMRA Verification' : 'Create My Account')}</React.Fragment>}
            </button>
            <p className="text-center text-[10px] text-slate-400 leading-snug">
              {role==='pharmacy'
                ? 'By registering you agree to the RxBridge pharmacist code of conduct & NMRA data-sharing terms.'
                : 'Protected with on-device encryption. Your prescription data never leaves your phone unencrypted.'}
            </p>
          </form>
        )}

        {/* ---------- VERIFYING PHASE ---------- */}
        {phase==='verifying' && (
          <div className="p-6 sm:p-8">
            <div className="flex flex-col gap-3">
              {STEPS.map((s, i) => {
                const done = i < vStep;
                const active = i === vStep;
                return (
                  <div key={s.t} className={`flex items-center gap-3 rounded-xl border px-4 py-3 transition-all duration-300 ${done ? 'border-emerald-200 bg-emerald-50/60' : active ? 'border-rx-blue/25 bg-blue-50/50' : 'border-slate-100 bg-slate-50/50 opacity-50'}`}>

                      {done ? <Icon name="check" size={15} className="anim-popIn"/> : active ? <Icon name="refresh" size={14} className="animate-spin"/> : <Icon name={s.icon} size={14}/>}
                    </span>
                    <span className={`text-[13px] font-semibold ${done ? 'text-emerald-700' : active ? 'text-slate-800' : 'text-slate-400'}`}>{s.t}</span>
                    {done && <span className="ml-auto text-[10px] font-mono font-bold text-emerald-500">OK</span>}

            <div className="mt-6 grid gap-2.5">

                className="w-full inline-flex items-center justify-center gap-2 rounded-xl bg-rx-blue px-4 py-3 text-sm font-bold text-white shadow-[0_12px_24px_-10px_rgba(30,64,175,.6)] hover:bg-blue-800 active:scale-[.99] transition-all">

        {phase==='done' && role==='pharmacy' && (
          <div className="p-5 sm:p-6 anim-fadeUp">

              <span className="grid place-items-center w-9 h-9 rounded-xl bg-white border border-amber-200 text-amber-500 shrink-0 shadow-sm"><Icon name="clock" size={16}/></span>
              <div>
                <p className="text-sm font-bold text-amber-700">Pending NMRA Licensing Verification (1–2 Hours)</p>

            <div className="mt-4 rounded-xl border border-slate-200 divide-y divide-slate-100 overflow-hidden">

            <span className="flex-1 min-w-0">
              <span className="block text-[13px] font-semibold text-slate-700 truncate group-hover:text-rx-blue transition-colors">{t.t}</span>
              <span className="block text-[11px] text-slate-400">{t.d}</span>

  );
}

const SCAN_STEPS = ['Reading image…','Detecting handwriting…','Matching NMRA drug database…','Extracting dosages…'];
const SCAN_SAMPLE = ['Amoxicillin 250mg','Panadol 500mg','Metformin 500mg'];

function ScannerCard({onUseTag, pushToast}){
  const inputRef = useRef(null);
  const ivRef = useRef(null);
  const [drag, setDrag] = useState(false);
  const [img, setImg] = useState(null);
  const [phase, setPhase] = useState('idle');
  const [progress, setProgress] = useState(0);
  const [step, setStep] = useState(0);
  const [tags, setTags] = useState([]);

  useEffect(() => () => clearInterval(ivRef.current), []);

  const startScan = () => {
    if (!img) pushToast('No photo attached — running a demo scan with a sample prescription.', 'info');
    setPhase('scanning'); setTags([]); setProgress(0); setStep(0);
    const t0 = Date.now();
    clearInterval(ivRef.current);
    ivRef.current = setInterval(() => {
      const p = Math.min(100, (Date.now()-t0)/2400*100);
      setProgress(p);
      setStep(Math.min(3, Math.floor(p/25)));
      if (p >= 100){ clearInterval(ivRef.current); setPhase('done'); setTags(SCAN_SAMPLE); }
    }, 80);
  };

  const handleFiles = (files) => {
    const file = files && files[0];
    if (!file) return;
    if (!/image\/(png|jpe?g)/.test(file.type)){ pushToast('Please drop a PNG or JPG image of the prescription.', 'error'); return; }
    setImg(URL.createObjectURL(file));
    startScan();
  };

  const reset = () => {
    clearInterval(ivRef.current);
    setImg(null); setPhase('idle'); setTags([]); setProgress(0); setStep(0);
    if (inputRef.current) inputRef.current.value = '';
  };

  return (
    <div className="bg-white rounded-2xl border border-slate-200 shadow-card p-5 flex flex-col anim-fadeUp" style={{animationDelay:'60ms'}}>
      <div className="flex items-center justify-between mb-4">
        <div className="flex items-center gap-2.5">
          <span className="grid place-items-center w-9 h-9 rounded-xl bg-rx-blue/10 text-rx-blue"><Icon name="sparkles" size={16}/></span>
          <div>

function MedAutocomplete({value, onChange, onPick}){
  const [open, setOpen] = useState(false);
  const [hi, setHi] = useState(-1);
  const boxRef = useRef(null);
  useClickOutside(boxRef, ()=>setOpen(false));

  const q = value.trim().toLowerCase();
  const sug = q
    ? MEDICINES.filter(m => (m.name+' '+m.strength+' '+(m.gener||'')).toLowerCase().includes(q)).slice(0,6)
    : MEDICINES.slice(0,5);

  const commit = (v) => { setOpen(false); setHi(-1); onPick(v); };

  return (
    <div className="relative" ref={boxRef}>
      <div className="relative">
        <Icon name="search" size={16} className="absolute left-3.5 top-1/2 -translate-y-1/2 text-slate-400"/>
        <input
          value={value}
          onChange={e=>{ onChange(e.target.value); setOpen(true); setHi(-1); }}
          onFocus={()=>setOpen(true)}
          onKeyDown={e=>{
            if (e.key==='ArrowDown'){ e.preventDefault(); setOpen(true); setHi(h=>Math.min(h+1, sug.length-1)); }
            else if (e.key==='ArrowUp'){ e.preventDefault(); setHi(h=>Math.max(h-1,-1)); }
            else if (e.key==='Enter'){ e.preventDefault(); commit(hi>=0 && sug[hi] ? `${sug[hi].name} ${sug[hi].strength}` : value); }
            else if (e.key==='Escape'){ setOpen(false); }
          }}
          placeholder={'Try "Ventolin inhaler" or "Panadol 500mg"'}
          aria-label="Medicine name"
          className="w-full rounded-xl border border-slate-200 bg-slate-50/60 pl-10 pr-9 py-3 text-sm font-medium text-slate-800 placeholder:text-slate-400 placeholder:font-normal outline-none focus:bg-white focus:border-rx-blue focus:ring-4 focus:ring-rx-blue/10 transition"/>
        {value && (
          <button onClick={()=>onChange('')} aria-label="Clear" className="absolute right-3 top-1/2 -translate-y-1/2 text-slate-300 hover:text-slate-500 transition-colors"><Icon name="x" size={14}/></button>

      </div>

        <div className="absolute z-30 mt-2 w-full rounded-xl border border-slate-200 bg-white shadow-pop p-1.5 overflow-hidden anim-fadeUp">
          {sug.map((m,i) => (
            <button key={m.key} onClick={()=>commit(`${m.name} ${m.strength}`)} onMouseEnter={()=>setHi(i)}
              className={`w-full flex items-center gap-3 px-2.5 py-2 rounded-lg text-left transition-colors ${i===hi ? 'bg-rx-blue/5' : 'hover:bg-slate-50'}`}>
              <span className="grid place-items-center w-8 h-8 rounded-lg bg-slate-100 text-slate-500 shrink-0"><Icon name="pill" size={14}/></span>
              <span className="flex-1 min-w-0">
                <span className="block text-sm font-semibold text-slate-800 truncate">{m.name} <span className="text-slate-400 font-normal">{m.strength}</span></span>
                <span className="block text-xs text-slate-400">{m.gener}</span>
              </span>
            </button>
          ))}
        </div>
      )}
      {open && q && sug.length===0 && (
        <div className="absolute z-30 mt-2 w-full rounded-xl border border-slate-200 bg-white shadow-pop px-3.5 py-3 anim-fadeUp">
          <p className="text-xs text-slate-400">No catalog match — press <span className="font-mono font-semibold text-slate-500">Enter</span> to search the raw name anyway.</p>
        </div>
      )}

  );

function MapPane({results, districtName}){
  const elRef = useRef(null);
  const mapRef = useRef(null);
  const layerRef = useRef(null);

  useEffect(() => {
    if (mapRef.current) return;
    const map = L.map(elRef.current, {zoomControl:false, scrollWheelZoom:false});
    map.setView([7.9, 80.7], 7);
    L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png', {
      maxZoom: 19, attribution: '&copy; OpenStreetMap &copy; CARTO'
    }).addTo(map);
    L.control.zoom({position:'bottomright'}).addTo(map);
    layerRef.current = L.layerGroup().addTo(map);
    mapRef.current = map;
  }, []);

  useEffect(() => {
    const map = mapRef.current, layer = layerRef.current;
    if (!map || !layer) return;
    layer.clearLayers();
    const d = DISTRICTS.find(x=>x.name===districtName) || DISTRICTS[0];
    if (!results || !results.length){ map.setView([d.lat, d.lng], d.zoom); return; }
    const bounds = [];
    results.forEach((r,i) => {
      const s = STATUS[r.status];
      const icon = L.divIcon({
        className:'rx-pin',
        html:`<span style="--c:${s.hex};animation-delay:${i*60}ms"></span>`,
        iconSize:[22,22], iconAnchor:[11,11]
      });
      const sHex = s.hex, sLabel = s.label;
      L.marker([r.lat, r.lng], {icon}).addTo(layer)
        .bindPopup(`
          <div style="min-width:190px">
            <div style="font-family:Sora,sans-serif;font-size:13px;font-weight:700;color:#0f172a">${r.name}</div>
            <div style="font-size:11px;color:#64748b;margin:2px 0 8px">${r.city} · ${r.dist} km away</div>
            <span style="display:inline-flex;align-items:center;gap:6px;font-size:11px;font-weight:600;color:${sHex};background:${sHex}14;border:1px solid ${sHex}40;border-radius:99px;padding:3px 9px">
              <span style="width:7px;height:7px;border-radius:99px;background:${sHex}"></span>${sLabel} — ${r.med}
            </span>
            <div style="margin-top:8px;font-size:11px;color:#94a3b8">Updated ${r.updated} ago · ${r.phone}</div>
          </div>`);
      bounds.push([r.lat, r.lng]);
    });
    if (bounds.length === 1) map.setView(bounds[0], 14);
    else map.fitBounds(bounds, {padding:[42,42], maxZoom:15});
  }, [results, districtName]);

  useEffect(() => () => { if (mapRef.current){ mapRef.current.remove(); mapRef.current=null; } }, []);

  return <div ref={elRef} className="w-full h-full"/>;
}

function ReservationModal({data, prefill, onClose, onConfirm}){
  const {pharmacy, med} = data;
  const [form, setForm] = useState({name: prefill?.name || '', phone: prefill?.phone || '', qty:1, time:PICKUP_TIMES[1]});
  const [touched, setTouched] = useState({});
  const [busy, setBusy] = useState(false);
  const nameRef = useRef(null);

  useEffect(() => {
    if (nameRef.current && !prefill?.name) nameRef.current.focus();
    const h = e => { if (e.key==='Escape') onClose(); };
    window.addEventListener('keydown', h);
    document.body.style.overflow = 'hidden';
    return () => { window.removeEventListener('keydown', h); document.body.style.overflow = ''; };
  }, []);

  const errors = useMemo(() => {
    const er = {};
    if (form.name.trim().length < 3) er.name = "Please enter the patient's full name (min 3 characters).";
    if (!RX_PHONE.test(digitsOf(form.phone))) er.phone = 'Enter a valid Sri Lankan mobile — e.g. +94 77 862 4415.';
    const q = Number(form.qty);
    if (!form.qty || isNaN(q) || q<1 || q>10 || !Number.isInteger(q)) er.qty = 'Quantity must be a whole number between 1 and 10.';
    return er;
  }, [form]);
  const errFor = k => touched[k] ? errors[k] : null;
  const touch = k => () => setTouched(t => ({...t, [k]:true}));
  const set = (k,v) => setForm(f => ({...f, [k]:v}));

  const inputCls = err => `w-full rounded-xl border ${err ? 'border-red-300 bg-red-50/40 focus:ring-red-100' : 'border-slate-200 bg-slate-50/60 focus:border-rx-blue focus:ring-rx-blue/10'} py-2.5 pl-10 pr-3 text-sm font-medium text-slate-800 placeholder:text-slate-400 placeholder:font-normal outline-none focus:ring-4 transition`;

  const submit = e => {
    e.preventDefault();
    setTouched({name:true, phone:true, qty:true});
    if (Object.keys(errors).length) return;
    setBusy(true);
    setTimeout(() => {
      const ref = 'RB-' + Math.floor(1000 + Math.random()*9000);
      onConfirm({...form, pharmacy, med, ref});
      setBusy(false);
      onClose();
    }, 900);
  };

  return (
    <div className="fixed inset-0 z-[80] flex items-end sm:items-center justify-center sm:p-4">
      <div className="absolute inset-0 bg-slate-900/45 backdrop-blur-[3px] anim-fadeIn" onClick={onClose}/>
      <div role="dialog" aria-modal="true" aria-label="Reserve medicine for pickup"
        className="relative w-full sm:max-w-md bg-white rounded-t-3xl sm:rounded-2xl shadow-pop anim-modalIn max-h-[92vh] overflow-y-auto scroll-slim">

        <div className="flex items-start justify-between gap-3 p-5 pb-4 border-b border-slate-100">
          <div className="flex items-start gap-3">
            <span className="grid place-items-center w-10 h-10 rounded-xl bg-rx-blue/10 text-rx-blue shrink-0"><Icon name="timer" size={18}/></span>
            <div>
              <h3 className="font-display font-bold text-slate-900 leading-tight">Reserve for 2-Hour Pickup</h3>
              <p className="text-xs text-slate-400 mt-1">{med} · at <span className="font-semibold text-slate-500">{pharmacy.name}</span>, {pharmacy.city} ({pharmacy.dist} km)</p>
            </div>
          </div>
          <button onClick={onClose} aria-label="Close dialog" className="grid place-items-center w-8 h-8 rounded-lg text-slate-400 hover:text-slate-700 hover:bg-slate-100 transition shrink-0"><Icon name="x" size={16}/></button>
        </div>

        <form onSubmit={submit} noValidate className="p-5 grid gap-4">
          <Field label="Patient Full Name" htmlFor="rx-name" error={errFor('name')}>
            <div className="relative">
              <Icon name="user" size={15} className="absolute left-3.5 top-1/2 -translate-y-1/2 text-slate-400 pointer-events-none"/>
              <input id="rx-name" ref={nameRef} value={form.name} onChange={e=>set('name', e.target.value)} onBlur={touch('name')}
                placeholder="e.g. Nimal Perera" className={inputCls(errFor('name'))}/>
            </div>
          </Field>

          <Field label="Mobile Number" htmlFor="rx-phone" error={errFor('phone')}>
            <div className="relative">
              <Icon name="phone" size={15} className="absolute left-3.5 top-1/2 -translate-y-1/2 text-slate-400 pointer-events-none"/>
              <input id="rx-phone" value={form.phone} onChange={e=>set('phone', e.target.value)} onBlur={touch('phone')}
                placeholder="+94 77 862 4415" className={inputCls(errFor('phone'))}/>
            </div>
          </Field>

          <div className="grid grid-cols-2 gap-3">
            <Field label="Quantity" htmlFor="rx-qty" error={errFor('qty')}>
              <div className={`flex items-center rounded-xl border ${errFor('qty') ? 'border-red-300' : 'border-slate-200'} bg-slate-50/60 overflow-hidden`}>
                <button type="button" aria-label="Decrease quantity" onClick={()=>set('qty', Math.max(1, Number(form.qty||1)-1))} disabled={Number(form.qty)<=1}
                  className="px-3 py-2.5 text-slate-500 hover:bg-slate-100 transition disabled:opacity-30"><Icon name="minus" size={14}/></button>
                <input id="rx-qty" type="number" min="1" max="10" value={form.qty} onBlur={touch('qty')}
                  onChange={e=>set('qty', e.target.value==='' ? '' : Math.max(1, Math.min(10, parseInt(e.target.value,10)||1)))}
                  className="no-spin w-full text-center bg-transparent text-sm font-semibold text-slate-800 py-2.5 outline-none"/>
                <button type="button" aria-label="Increase quantity" onClick={()=>set('qty', Math.min(10, Number(form.qty||0)+1))} disabled={Number(form.qty)>=10}
                  className="px-3 py-2.5 text-slate-500 hover:bg-slate-100 transition disabled:opacity-30"><Icon name="plus" size={14}/></button>
              </div>
            </Field>
            <Field label="Pickup Time" htmlFor="rx-time">
              <div className="relative">
                <select id="rx-time" value={form.time} onChange={e=>set('time', e.target.value)}
                  className="appearance-none w-full rounded-xl border border-slate-200 bg-slate-50/60 pl-3.5 pr-9 py-[11px] text-sm font-semibold text-slate-700 outline-none focus:border-rx-blue focus:ring-4 focus:ring-rx-blue/10 transition cursor-pointer">
                  {PICKUP_TIMES.map(t => <option key={t} value={t}>{t}</option>)}
                </select>
                <Icon name="chevronDown" size={15} className="absolute right-3 top-1/2 -translate-y-1/2 text-slate-400 pointer-events-none"/>
              </div>
            </Field>
          </div>

          <div className="flex items-center gap-2 rounded-xl bg-slate-50 border border-slate-100 px-3.5 py-2.5 text-[11px] text-slate-500 leading-snug">
            <Icon name="shield" size={14} className="text-emerald-500 shrink-0"/>
            Free reservation — stock is held for 2 hours. Pay at the counter on pickup.
          </div>

          <button type="submit" disabled={busy}
            className="w-full inline-flex items-center justify-center gap-2 rounded-xl bg-rx-blue px-4 py-3 text-sm font-bold text-white shadow-[0_12px_24px_-10px_rgba(30,64,175,.6)] hover:bg-blue-800 active:scale-[.99] transition-all duration-150 disabled:opacity-60">
            {busy
              ? <React.Fragment><Icon name="refresh" size={15} className="animate-spin"/>Confirming…</React.Fragment>
              : <React.Fragment><Icon name="checkCheck" size={15}/>Confirm 2-Hour Pickup Reservation</React.Fragment>}
          </button>
        </form>
      </div>
    </div>
  );
}

function PharmacistView({pushToast, queue, leaving, decide, branchStock, setBranchStock, auth}){
  const [flash, setFlash] = useState(null);
  const [changed, setChanged] = useState({});
  const [updates, setUpdates] = useState(23);
  const [syncing, setSyncing] = useState(false);
  const [now, setNow] = useState(new Date());

  useEffect(() => { const iv = setInterval(()=>setNow(new Date()), 30000); return ()=>clearInterval(iv); }, []);

  const isPartner = auth?.role==='pharmacy';
  const phName  = isPartner ? auth.phName  : 'Bambalapitiya Community Pharmacy';
  const metaLine = isPartner
    ? `${auth.license} · ${auth.city}, ${auth.district} District · SLMC ${auth.slmc}`
    : 'BRANCH WP-CMB-0231 · 254 Galle Road, Bambalapitiya · Pharmacist-in-charge: A. Perera';

  const statusOfItem = it => branchStock[`${it.name} ${it.strength}`.toLowerCase()] || it.def;
  const lowC = INVENTORY.filter(it => statusOfItem(it)==='low').length;
  const outC = INVENTORY.filter(it => statusOfItem(it)==='out').length;
  const pendingC = queue.filter(r => r.status==='pending').length;

  const setStatus = it => v => {
    setBranchStock(s => ({...s, [`${it.name} ${it.strength}`.toLowerCase()]: v}));
    setChanged(c => ({...c, [it.id]: true}));
    setUpdates(u => u+1);
    setFlash(it.id);
    setTimeout(()=>setFlash(f => f===it.id ? null : f), 800);
  };

  const onAccept = id => {
    const r = queue.find(x=>x.id===id);
    decide(id, true);
    pushToast(`Accepted ${r.patient}'s reservation — pickup code sent via SMS.`, 'success');
  };
  const onDecline = id => {
    const r = queue.find(x=>x.id===id);
    decide(id, false);
    pushToast(`Declined ${r.patient}'s request — patient directed to alternatives.`, 'error');
  };

  const sync = () => {
    if (syncing) return;
    setSyncing(true);
    setTimeout(() => { setSyncing(false); pushToast('Network sync complete — 2,431 pharmacy nodes responded.', 'info'); }, 1000);
  };

  const stats = [
    {icon:'bell',       label:'Open Requests',   value:pendingC, tint:'bg-rx-blue/10 text-rx-blue'},
    {icon:'alert',      label:'Low Stock Lines', value:lowC,     tint:'bg-amber-50 text-amber-600'},
    {icon:'package',    label:'Out of Stock',    value:outC,     tint:'bg-red-50 text-red-500'},
    {icon:'checkCheck', label:'Updates Today',   value:updates,  tint:'bg-emerald-50 text-emerald-600'},
  ];

  const updatedText = it => changed[it.id] ? 'just now' : `${it.updated} ago`;

  return (
    <div className="max-w-7xl mx-auto px-4 sm:px-6 pt-6 md:pt-8 pb-16 space-y-5">
      {/* Dashboard header */}
      <div className="bg-white rounded-2xl border border-slate-200 shadow-card p-5 flex flex-wrap items-center gap-4 justify-between anim-fadeUp">
        <div className="flex items-center gap-3.5">
          <span className="grid place-items-center w-12 h-12 rounded-2xl bg-rx-blue text-white shadow-[0_10px_20px_-8px_rgba(30,64,175,.6)]"><Icon name="store" size={22}/></span>
          <div>
            <div className="flex items-center gap-2 flex-wrap">
              <h1 className="font-display text-lg sm:text-xl font-bold text-slate-900 tracking-tight">{phName}</h1>
              {isPartner && !auth.verified
                ? <span className="inline-flex items-center gap-1.5 rounded-full border border-amber-200 bg-amber-50 px-2 py-0.5 text-[10px] font-bold text-amber-600"><Icon name="clock" size={10}/>PENDING NMRA VERIFICATION</span>
                : <span className="inline-flex items-center gap-1.5 rounded-full border border-emerald-200 bg-emerald-50 px-2 py-0.5 text-[10px] font-bold text-emerald-600"><Icon name="shield" size={10}/>NMRA VERIFIED</span>}
            </div>
            <p className="text-[11px] text-slate-400 mt-0.5 font-mono">{metaLine}</p>
          </div>
        </div>
        <div className="flex items-center gap-3">
          <span className="text-right hidden sm:block">
            <span className="block text-[10px] font-bold uppercase tracking-wider text-slate-400">Local time</span>
            <span className="font-mono text-sm font-semibold text-slate-700">{now.toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit'})} <span className="text-slate-400 font-normal">GMT+5:30</span></span>
          </span>
          <button onClick={sync}
            className="inline-flex items-center gap-2 rounded-xl border border-slate-200 px-3.5 py-2.5 text-sm font-semibold text-slate-600 hover:border-rx-blue/40 hover:text-rx-blue hover:bg-rx-blue/5 active:scale-[.98] transition-all">
            <Icon name="refresh" size={15} className={syncing ? 'animate-spin' : ''}/>Sync Network
          </button>
        </div>
      </div>

      {/* Vitals strip */}
      <div className="bg-white rounded-2xl border border-slate-200 shadow-card grid grid-cols-2 lg:grid-cols-4 divide-y lg:divide-y-0 lg:divide-x divide-slate-100 anim-fadeUp" style={{animationDelay:'60ms'}}>
        {stats.map(s => (
          <div key={s.label} className="p-4 sm:p-5 flex items-center gap-3.5">
            <span className={`grid place-items-center w-10 h-10 rounded-xl shrink-0 ${s.tint}`}><Icon name={s.icon} size={18}/></span>
            <div>
              <div className="font-display text-2xl font-bold text-slate-900 leading-none tabular-nums">{s.value}</div>
              <div className="text-[10px] text-slate-400 mt-1.5 font-bold uppercase tracking-wider">{s.label}</div>
            </div>
          </div>
        ))}
      </div>

      <div className="grid lg:grid-cols-3 gap-5 items-start">
        {/* Inventory table */}
        <div className="lg:col-span-2 bg-white rounded-2xl border border-slate-200 shadow-card overflow-hidden anim-fadeUp" style={{animationDelay:'120ms'}}>
          <div className="px-5 py-4 border-b border-slate-100 flex items-center justify-between gap-3">
            <div className="flex items-center gap-2.5">
              <Icon name="package" size={17} className="text-rx-blue"/>
              <h2 className="font-display font-semibold text-slate-900">Inventory Status</h2>
              <span className="text-[10px] font-mono text-slate-400 bg-slate-100 rounded px-1.5 py-0.5">{INVENTORY.length} lines</span>
            </div>
            <span className="text-[11px] text-slate-400 hidden sm:block">Changes reflect instantly in the Patient Portal</span>
          </div>

          <table className="hidden md:table w-full text-sm">
            <thead>
              <tr className="text-left text-[10px] uppercase tracking-wider text-slate-400 border-b border-slate-100 bg-slate-50/50">
                <th className="px-5 py-2.5 font-bold">Medicine</th>
                <th className="px-3 py-2.5 font-bold">Active Ingredient</th>
                <th className="px-3 py-2.5 font-bold">Form / Shelf</th>
                <th className="px-3 py-2.5 font-bold">Status</th>
                <th className="px-5 py-2.5 font-bold text-right">Updated</th>
              </tr>
            </thead>
            <tbody>
              {INVENTORY.map(it => {
                const st = STATUS[statusOfItem(it)];
                return (
                  <tr key={it.id} className={`border-b border-slate-50 last:border-0 transition-colors duration-500 ${flash===it.id ? 'bg-rx-blue/[.05]' : 'hover:bg-slate-50/60'}`}>
                    <td className="px-5 py-3">
                      <div className="flex items-center gap-3">
                        <span className={`grid place-items-center w-8 h-8 rounded-lg shrink-0 ${st.tint}`}><Icon name="pill" size={14}/></span>
                        <div>
                          <div className="font-semibold text-slate-800">{it.name}</div>
                          <div className="text-xs text-slate-400">{it.strength}</div>
                        </div>
                      </div>
                    </td>
                    <td className="px-3 py-3 text-slate-500 text-xs">{it.ingredient}</td>
                    <td className="px-3 py-3 text-slate-500 text-xs">{it.form} · <span className="font-mono">{it.shelf}</span></td>
                    <td className="px-3 py-3"><StatusSegment value={statusOfItem(it)} onChange={setStatus(it)}/></td>
                    <td className="px-5 py-3 text-right"><span className={`text-xs font-mono ${changed[it.id] ? 'text-emerald-600 font-semibold' : 'text-slate-400'}`}>{updatedText(it)}</span></td>
                  </tr>
                );
              })}
            </tbody>
          </table>

          {/* Mobile inventory cards */}
          <div className="md:hidden divide-y divide-slate-100">
            {INVENTORY.map(it => (
              <div key={it.id} className={`p-4 flex flex-col gap-3 transition-colors duration-500 ${flash===it.id ? 'bg-rx-blue/[.05]' : ''}`}>
                <div className="flex items-start justify-between gap-3">
                  <div className="flex items-center gap-3 min-w-0">
                    <span className={`grid place-items-center w-8 h-8 rounded-lg shrink-0 ${STATUS[statusOfItem(it)].tint}`}><Icon name="pill" size={14}/></span>
                    <div className="min-w-0">
                      <div className="font-semibold text-slate-800 text-sm truncate">{it.name}</div>
                      <div className="text-xs text-slate-400">{it.strength} · {it.ingredient}</div>
                      <div className="text-[11px] text-slate-300 font-mono">{it.form} · {it.shelf}</div>
                    </div>
                  </div>
                  <span className={`text-[10px] font-mono shrink-0 ${changed[it.id] ? 'text-emerald-600 font-semibold' : 'text-slate-300'}`}>{updatedText(it)}</span>
                </div>
                <StatusSegment value={statusOfItem(it)} onChange={setStatus(it)}/>
              </div>
            ))}
          </div>
        </div>

        {/* Reservations queue */}
        <div className="bg-white rounded-2xl border border-slate-200 shadow-card overflow-hidden flex flex-col anim-fadeUp" style={{animationDelay:'180ms'}}>
          <div className="px-5 py-4 border-b border-slate-100 flex items-center justify-between">
            <div className="flex items-center gap-2.5">
              <Icon name="bell" size={17} className="text-amber-500"/>
              <h2 className="font-display font-semibold text-slate-900">Incoming Reservations</h2>
            </div>
            <span className="rounded-full bg-rx-blue text-white text-[11px] font-bold px-2 py-0.5 font-mono">{pendingC}</span>
          </div>

          <div className="p-4 flex flex-col gap-3 overflow-y-auto scroll-slim max-h-[600px]">
            {queue.length===0 ? (
              <div className="anim-fadeUp flex flex-col items-center justify-center py-14 text-center">
                <span className="grid place-items-center w-12 h-12 rounded-2xl bg-emerald-50 text-emerald-500 mb-3"><Icon name="inbox" size={22}/></span>
                <p className="text-sm font-semibold text-slate-600">Queue clear</p>
                <p className="text-xs text-slate-400 mt-1 max-w-[220px]">All pickup requests handled. New ones will appear here instantly.</p>
              </div>
            ) : queue.map(r => (
              <QueueCard key={r.id} r={r} leaving={!!leaving[r.id]} onAccept={onAccept} onDecline={onDecline}/>
            ))}
          </div>
          <p className="px-5 py-3 border-t border-slate-100 text-[11px] text-slate-400 leading-snug">
            Requests placed in the <span className="font-semibold text-slate-500">Patient Search Portal</span> land here in real time — try reserving one.
          </p>
        </div>
      </div>
    </div>
  );
}

/* ============================================================
   FOOTER + APP ROOT
   ============================================================ */
function Footer(){
  return (
    <footer className="border-t border-slate-200 bg-white">
      <div className="max-w-7xl mx-auto px-4 sm:px-6 py-6 flex flex-col sm:flex-row items-center justify-between gap-3 text-xs text-slate-400">
        <div className="flex items-center gap-2.5">
          <LogoMark size={24}/>
          <span className="font-display font-semibold text-slate-600">RxBridge LK</span>
          <span>· Smart Medical Shortage Engine &amp; Direct Pharmacy Network</span>
        </div>
        <div className="flex flex-wrap items-center justify-center gap-x-4 gap-y-1 font-mono">
          <span className="flex items-center gap-1.5"><span className="w-1.5 h-1.5 rounded-full bg-emerald-500 anim-live"/>2,431 nodes reporting</span>
          <span>Demo build · data simulated</span>
          <a href="tel:1990" className="text-red-500 font-semibold hover:underline">Emergency 1990</a>
        </div>
      </div>
    </footer>
  );
}

function App(){
  const [view, setView] = useState('patient');
  const [toasts, setToasts] = useState([]);
  const [queue, setQueue] = useState(SEED_QUEUE);
  const [leaving, setLeaving] = useState({});
  const [branchStock, setBranchStock] = useState({});
  const [modal, setModal] = useState(null);
  const [auth, setAuth] = useState(null);
  const [authOpen, setAuthOpen] = useState(false);
  const [authPreset, setAuthPreset] = useState('patient');
  const idRef = useRef(0);

  const dismiss = useCallback(id => setToasts(t => t.filter(x => x.id !== id)), []);
  const pushToast = useCallback((msg, type='success') => {
    const id = ++idRef.current;
    setToasts(t => [...t.slice(-3), {id, msg, type}]);
    setTimeout(() => dismiss(id), 4200);
  }, [dismiss]);

  const scrollToId = id => setTimeout(() => {
    const el = document.getElementById(id);
    if (el) el.scrollIntoView({behavior:'smooth', block:'start'});
  }, 140);

  const openAuth = role => { setAuthPreset(role || 'patient'); setAuthOpen(true); };

  const handleAuth = a => {
    setAuth(a);
    setAuthOpen(false);
    if (a.role === 'pharmacy'){
      setView('pharmacist');
      pushToast(a.verified
        ? `Welcome back, ${a.phName}. Inventory controls unlocked.`
        : `Application received — ${a.phName} is pending NMRA verification.`, a.verified ? 'success' : 'info');
      scrollToId('top');
    } else {
      pushToast(`Welcome${a.name ? ', ' + a.name.split(' ')[0] : ''}! You're signed in — reservations will now prefill your details.`, 'success');
    }
  };

  const signOut = () => {
    setAuth(null);
    pushToast('You have been signed out. Stay safe!', 'info');
  };

  const addReservation = r => {
    setQueue(q => [{id:'r'+Date.now(), patient:r.name, phone:r.phone, med:r.med, qty:r.qty, time:r.time, status:'pending', requested:'just now', isNew:true}, ...q]);
  };

  const decide = (id, ok) => {
    setQueue(q => q.map(r => r.id===id ? {...r, status: ok?'confirmed':'declined', isNew:false} : r));
    setTimeout(() => {
      setLeaving(l => ({...l, [id]:true}));
      setTimeout(() => {
        setQueue(q => q.filter(r => r.id !== id));
        setLeaving(l => { const n = {...l}; delete n[id]; return n; });
      }, 320);
    }, 1700);
  };

  return (
    <React.Fragment>
      <span id="top"/>
      <Header view={view} setView={setView} auth={auth} onOpenAuth={openAuth} onSignOut={signOut} scrollToId={scrollToId}/>
      <main className="min-h-[70vh]">
        {view==='patient'
          ? <PatientView key="patient" pushToast={pushToast} branchStock={branchStock}
              onReserve={(pharmacy, med) => setModal({pharmacy, med})}/>
          : <PharmacistView key="pharmacist" pushToast={pushToast} queue={queue} leaving={leaving} decide={decide}
              branchStock={branchStock} setBranchStock={setBranchStock} auth={auth}/>}
      </main>
      <Footer/>
      <ToastHost toasts={toasts} dismiss={dismiss}/>
      {authOpen && (
        <AuthModal key={authPreset+'-'+String(authOpen)} presetRole={authPreset}
          onClose={()=>setAuthOpen(false)} onAuth={handleAuth} pushToast={pushToast}/>
      )}
      {modal && (
        <ReservationModal data={modal}
          prefill={auth?.role==='patient' ? {name: auth.name, phone: auth.phone} : null}
          onClose={()=>setModal(null)}
          onConfirm={r => {
            addReservation(r);
            pushToast(`Reservation ${r.ref} confirmed — show the SMS code at ${r.pharmacy.name}.`, 'success');
          }}/>
      )}
    </React.Fragment>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
