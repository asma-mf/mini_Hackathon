<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120" fill="none">
  <defs>
    <linearGradient id="medispot-bg" x1="0" y1="0" x2="120" y2="120" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1e40af" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#1e40af" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Base Rounded Container -->
  <rect width="120" height="120" rx="32" fill="url(#medispot-bg)" filter="url(#shadow)" />

  <!-- Medical Cross in Pure White -->
  <path d="M60 26V58M44 42H76" stroke="#ffffff" stroke-width="9" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Dynamic Pulse / Care Arc in Emerald Green -->
  <path d="M26 88C37.5 73 50.5 65.5 60 65.5C69.5 65.5 82.5 73 94 88" stroke="#34d399" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" />
</svg>
